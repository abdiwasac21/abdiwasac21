<svg viewBox="0 0 1280 360" width="1280" height="360" fill="none" xmlns="http://www.w3.org/2000/svg" font-family="'SF Mono','Cascadia Code','JetBrains Mono','Fira Code',Consolas,'Courier New',monospace">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1280" y2="360" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#0B1620"/>
      <stop offset="0.5" stop-color="#102A33"/>
      <stop offset="1" stop-color="#0B1620"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#00D9FF"/>
      <stop offset="1" stop-color="#FF6B9D"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.28" cy="0.45" r="0.6">
      <stop offset="0" stop-color="#00D9FF" stop-opacity="0.16"/>
      <stop offset="1" stop-color="#00D9FF" stop-opacity="0"/>
    </radialGradient>
    <clipPath id="frame"><rect x="0" y="0" width="1280" height="360" rx="16"/></clipPath>
  </defs>

  <g clip-path="url(#frame)">
    <!-- base -->
    <rect width="1280" height="360" fill="url(#bg)"/>
    <rect width="1280" height="360" fill="url(#glow)"/>

    <!-- faint code wallpaper (the "in tech" texture) -->
    <g font-size="15" letter-spacing="0.3" opacity="0.5">
      <g fill="#3F6E7A">
        <text x="640" y="44">import { Engineer } from "@somaliland/dev";</text>
        <text x="640" y="72">const me = new Engineer({ stack: "full" });</text>
        <text x="640" y="100">async function build(idea) {</text>
        <text x="690" y="128">const api = await connect(services);</text>
        <text x="690" y="156">const ai  = llm.integrate(api, { tools });</text>
        <text x="690" y="184">return ship(ai, { reliable: true });</text>
        <text x="640" y="212">}</text>
        <text x="640" y="240">while (curious) { learn(); refactor(); }</text>
        <text x="640" y="268">db.query("SELECT impact FROM work");</text>
        <text x="640" y="296">export default me;  // boring code, ships</text>
      </g>
      <g fill="#1F4753">
        <text x="44" y="328">// connectivity is never a given — build offline-first</text>
      </g>
    </g>

    <!-- left line-number gutter -->
    <g font-size="14" fill="#244C57" text-anchor="end" letter-spacing="1">
      <text x="44" y="120">01</text>
      <text x="44" y="150">02</text>
      <text x="44" y="180">03</text>
      <text x="44" y="210">04</text>
      <text x="44" y="240">05</text>
    </g>
    <line x1="60" y1="80" x2="60" y2="290" stroke="#1C3A44" stroke-width="1"/>

    <!-- terminal tab -->
    <g transform="translate(96,44)">
      <circle cx="8" cy="8" r="6" fill="#FF5F57"/>
      <circle cx="30" cy="8" r="6" fill="#FEBC2E"/>
      <circle cx="52" cy="8" r="6" fill="#28C840"/>
      <text x="78" y="13" font-size="14" fill="#5C8593" letter-spacing="0.5">abdiwasac@dev — ~/portfolio</text>
    </g>

    <!-- name -->
    <text x="96" y="178" font-size="62" font-weight="700" fill="#FFFFFF" letter-spacing="1">Abdiwasac Adnan</text>

    <!-- accent underline -->
    <rect x="98" y="196" width="300" height="4" rx="2" fill="url(#accent)"/>

    <!-- prompt + role line -->
    <g font-size="22" letter-spacing="0.5">
      <text x="96" y="248" fill="#00D9FF" font-weight="600">&#8250;</text>
      <text x="120" y="248" fill="#CFE9F0">Software Engineer</text>
      <text x="120" y="282" fill="#6FA3B0" font-size="18">Full-Stack &#183; Cross-Platform &#183; AI Integration</text>
    </g>

    <!-- blinking-style cursor block -->
    <rect x="525" y="266" width="13" height="20" fill="#00D9FF" opacity="0.85"/>

    <!-- corner location chip -->
    <g transform="translate(1040,300)">
      <rect x="0" y="0" width="200" height="34" rx="17" fill="#0F2730" stroke="#1F4753" stroke-width="1"/>
      <circle cx="22" cy="17" r="5" fill="#FF6B9D"/>
      <text x="38" y="22" font-size="14" fill="#7FB3C0" letter-spacing="0.5">Hargeisa, Somaliland</text>
    </g>

    <!-- subtle border -->
    <rect x="0.5" y="0.5" width="1279" height="359" rx="16" fill="none" stroke="#1C3A44" stroke-width="1"/>
  </g>
</svg>
